//🎰🎰Rendering y animación
let ultimoFrame = 0;
const intervalo = esMovil ? 1000 / 30 : 1000 / 60;

function render(tiempo) {
    requestAnimationFrame(render);

    if (tiempo - ultimoFrame < intervalo) return;

    ultimoFrame = tiempo;

    controls.update();
    renderer.render(scene, camera);
}

requestAnimationFrame(render);
